# The repo is one Cargo workspace laid out as workspace -> domain -> module: each domain is a
# directory under domains/, and each module in it is a crate (domains/<domain>/<module>).
# See domains/README.md. domains/teleoperation/console
# and domains/visualization/mapbuild keep their own lockfiles and build on their own.
[workspace]
members = ["domains/*/*", "tools/tasks", "tools/expectation"]
default-members = [".", "domains/simulation/sim"]
exclude = ["domains/teleoperation/console", "domains/teleoperation/command", "domains/teleoperation/launcher", "domains/visualization/mapbuild", "domains/teleoperation/edgetx", "vendor/bevy_solari"]

[package]
name = "sim001"
version = "0.1.0"
edition = "2024"
# `cargo run` starts the launcher (src/bin/launcher.rs); the sim is `cargo run --bin sim001`
# (domains/simulation/sim).
default-run = "sim001_launch"

[[bin]]
name = "sim001_launch"
path = "src/bin/launcher.rs"

# Keep `cargo run` (debug) playable: optimize dependencies, light opts for our code.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Solari with one shader fix: bend G-buffer normals that face away from the camera (smooth
# terrain normals at grazing ridge silhouettes) instead of shading them black.
# See vendor/bevy_solari/src/realtime/gbuffer_utils.wesl.
[patch.crates-io]
bevy_solari = { path = "vendor/bevy_solari" }

# The on-board executor as a static library for the ArduPlane fork: no unwinding, small.
# cargo build --profile embedded -p cognition_executor --features ffi-static
[profile.embedded]
inherits = "release"
panic = "abort"
opt-level = "s"
lto = true
