# The repo is one Cargo workspace laid out as workspace -> domain -> module: each domain is a
# directory under domains/, and each module in it is a crate (domains/<domain>/<module>).
# See domains/README.md. The sim (this package) and station/ predate the layout. gcs/ and
# tools/mapbuild keep their own lockfiles and build on their own.
[workspace]
members = ["station", "domains/*/*"]
exclude = ["gcs", "tools/mapbuild", "vendor/bevy_solari"]

[package]
name = "t1s_sim"
version = "0.1.0"
edition = "2024"

[dependencies]
t1s_station = { path = "station" }
# The flight model and the planes it flies: see domains/simulation.
simulation_aircraft = { path = "domains/simulation/aircraft" }
simulation_physics = { path = "domains/simulation/physics" }
# Games against computer pilots: see domains/recreation.
recreation_games = { path = "domains/recreation/games" }
# Map packs (real places): aerial photos and land cover. Same version Bevy uses.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
bevy = { version = "0.20.0", features = ["bevy_solari", "free_camera"] }
# What the radios tell the pilot about other aircraft: see domains/communication.
communication_air = { path = "domains/communication/air" }
communication_radio = { path = "domains/communication/radio" }
communication_telemetry = { path = "domains/communication/telemetry" }
communication_traffic = { path = "domains/communication/traffic" }
# The shared look: the HUD and overlays use the same theme as the ground station and the docs.
design_theme = { path = "domains/design/theme" }
# Acceptance tests (`--expect`): see domains/expectation and expectations/.
expectation_harness = { path = "domains/expectation/harness" }
expectation_model = { path = "domains/expectation/model" }
expectation_story = { path = "domains/expectation/story" }

[target.'cfg(target_os = "macos")'.dependencies]
hidapi = "2"
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSResponder", "NSRunningApplication"] }
objc2-foundation = "0.3"
objc2-game-controller = { version = "0.3.2", features = ["GCController", "GCExtendedGamepad", "GCControllerAxisInput", "GCControllerButtonInput", "GCControllerDirectionPad", "GCControllerElement", "GCPhysicalInputProfile", "GCDevice"] }

# Keep `cargo run` (debug) playable: optimize dependencies, light opts for our code.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Solari with one shader fix: bend G-buffer normals that face away from the camera (smooth
# terrain normals at grazing ridge silhouettes) instead of shading them black.
# See vendor/bevy_solari/src/realtime/gbuffer_utils.wesl.
[patch.crates-io]
bevy_solari = { path = "vendor/bevy_solari" }
