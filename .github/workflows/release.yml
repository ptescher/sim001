# Builds the bundle on macOS and Linux and publishes it as a GitHub release.
#   git tag v0.1.0 && git push origin v0.1.0
# The tag must match the version in Cargo.toml. The bundle holds the launcher, the sim, the ground
# station, ArduPlane SITL, the maps and the manual (rendered from site/results and site/screenshots,
# the results of the last local run: see `tasks pack-docs`).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build (it must exist)
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-arm64
            file: target/bundle/SIM001-macos.zip
          - os: ubuntu-latest
            name: linux-x86_64
            file: target/bundle/sim001-linux.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: The tag matches the version
        shell: bash
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "$TAG" = "v$v" ] || { echo "tag $TAG, but Cargo.toml says $v" >&2; exit 1; }
          echo "SIM001_VERSION=$v" >> "$GITHUB_ENV"
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libvulkan-dev libssl-dev rsync \
            libxkbcommon-x11-dev libxcb1-dev libxcb-xkb-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libfontconfig-dev libfreetype-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            domains/teleoperation/console
            domains/teleoperation/launcher
            domains/visualization/mapbuild
      - name: ArduPlane SITL
        uses: actions/cache@v4
        with:
          path: .ardupilot
          key: ardupilot-${{ runner.os }}-${{ hashFiles('ardupilot/build_native.sh', 'ardupilot/patches/**') }}
      - run: ardupilot/build_native.sh
      - name: Test results for the manual
        run: |
          mkdir -p docs
          cp -r site/results site/screenshots docs/
      - run: tools/bundle.sh
      - name: Name the file
        shell: bash
        run: |
          ext=$(basename "${{ matrix.file }}"); ext=${ext#*.}
          cp "${{ matrix.file }}" "SIM001-$SIM001_VERSION-${{ matrix.name }}.$ext"
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.name }}
          path: SIM001-*

  release:
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" SIM001-* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "SIM001 ${TAG#v}" --generate-notes
