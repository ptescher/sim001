# The full end-to-end run (`tasks docs`: every runner in turn, with ArduPlane SITL, windows and the
# GPU) on the maintainer's own Mac, a self-hosted runner, so the free GitHub minutes are not spent.
# Set the runner up with tools/runner/setup.sh.
#
# This repository is PUBLIC, and a self-hosted runner runs whatever a workflow says, on the
# owner's machine. So this workflow never runs code from a fork:
#   - `merge_group` and `push` to master run code that was already reviewed and merged;
#   - a pull request runs only when it comes from a branch of this repository (the `if:` below),
#     and only when it carries the `e2e` label, which only someone with write access can add.
# Also keep Settings > Actions > General > "Fork pull request workflows" on "Require approval for
# all external contributors".
name: E2E

on:
  merge_group:
  push:
    branches: [master]
    paths-ignore: ["**.md", "docs/**", "plans/**", "site/**"]
  pull_request:
    types: [labeled, synchronize, reopened]
    paths-ignore: ["**.md", "docs/**", "plans/**", "site/**"]

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  e2e:
    name: end-to-end (self-hosted Mac)
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'e2e'))
    runs-on: [self-hosted, macOS, ARM64, sim001]
    timeout-minutes: 120
    steps:
      # clean: false keeps target/ (and so the builds) between runs; the workspace is the same directory each time.
      - uses: actions/checkout@v4
        with:
          clean: false
      # ArduPlane is built once, in the main checkout (ardupilot/build_native.sh); every job links it.
      - name: Link the built ArduPlane
        run: |
          : "${SIM001_ARDUPILOT:=$HOME/code/t1s_sim/.ardupilot}"
          test -x "$SIM001_ARDUPILOT/build/sitl/bin/arduplane" || { echo "no ArduPlane at $SIM001_ARDUPILOT"; exit 1; }
          ln -sfn "$SIM001_ARDUPILOT" .ardupilot
      - name: Everything, with time limits
        run: cargo run --release --locked -p sim001_tasks -- docs
      - name: Results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: docs/results
          if-no-files-found: ignore
