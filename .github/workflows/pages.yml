# Publishes the landing page (site/) and the manual (generated from expectations/) to GitHub Pages.
# The tests can't run in CI (Docker, ArduPilot, a GPU), so the manual shows the results of the last local
# run: `tasks docs`, then `tasks pack-docs` (cargo run --release -p sim001_tasks --), then commit site/results and site/screenshots.
name: Pages

on:
  push:
    branches: [master]
    paths: [site/**, expectations/**, tools/expectation/**, domains/illustration/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
      - name: Generate the manual
        # the test results and screenshots come from the last local run (`tasks pack-docs`)
        run: |
          mkdir out
          cp -r site/results site/screenshots out/
          cargo run -q -p expectation -- docs expectations out
      - name: Assemble the site
        run: |
          mkdir -p _site/docs
          cp -r site/*.html site/*.jpg _site/
          cp -r out/site out/screenshots _site/docs/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
