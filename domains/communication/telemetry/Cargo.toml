[package]
name = "communication_telemetry"
version = "0.1.0"
edition = "2024"
description = "Communication domain: MAVLink messages about other aircraft (positions, ADS-B, Remote ID) made from what a device knows and read into what a station can track"

[dependencies]
communication_remoteid = { path = "../remoteid" }
communication_traffic = { path = "../traffic" }
mavlink = { version = "0.19", default-features = false, features = ["std", "dialect-common", "mav2-message-extensions"] }
num-traits = "0.2"
