[package]
name = "recreation_towers"
version = "0.1.0"
edition = "2024"
description = "Recreation domain: Towers, a team game for drones flown by plan: the towers, capture, points, vision and the fog of each team"

[dependencies]
glam = { workspace = true, features = ["serde"] }
# The seat protocol: JSON lines (see seat.rs).
serde.workspace = true
serde_json.workspace = true
# The colours of the pictures of a team's map (svg.rs): the look of the commander app.
illustration_theme = { path = "../../illustration/theme" }

[dev-dependencies]
# The acceptance tests (tests/acceptance.rs): the section "Towers" with no window.
expectation_harness.workspace = true
expectation_model.workspace = true
expectation_story.workspace = true
