[package]
name = "teleoperation_command"
version = "0.1.0"
edition = "2024"
description = "The commander app of Towers: a person's seat on the game server, with the team's map, its fog, the towers, the drones and their orders. GPUI"

[dependencies]
gpui = "0.2.2"
# The game: the seat protocol, the team's map, the rules.
recreation_towers = { path = "../../recreation/towers" }
glam = "0.33"
# The sensor feed protocol: the cameras of the drones come the way the sim's sensor camera does.
teleoperation_shared = { path = "../shared" }
# The shared look (the console, the sim's HUD and the docs use it too).
illustration_theme = { path = "../../illustration/theme" }
# Acceptance tests (`--expect`): see github.com/ptescher/expectation and expectations/.
expectation_harness = { git = "https://github.com/ptescher/expectation" }
expectation_model = { git = "https://github.com/ptescher/expectation" }
expectation_story = { git = "https://github.com/ptescher/expectation" }
suite_budget = { path = "../../../tools/suite_budget" }
# The screenshots' JPEGs (snapshot.rs) and the map's PNG (ground.rs); the same image crate as GPUI's.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }


# Keep `cargo run` (debug) usable: optimize dependencies.
[profile.dev.package."*"]
opt-level = 3

# GPUI with `DispatchEventResult` public, so `--expect` can deliver mouse events the way the
# platform does (see vendor/gpui/src/window.rs), as the console does.
[patch.crates-io]
gpui = { path = "../../../vendor/gpui" }
xattr = { path = "../../../vendor/xattr" }

[[bin]]
name = "sim001_command"
path = "src/main.rs"

# Its own workspace (the root one excludes it): it builds on its own, also from a checkout inside
# another checkout (a worktree under .claude/worktrees).
[workspace]
