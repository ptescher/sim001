[package]
name = "teleoperation_launcher"
version = "0.1.0"
edition = "2024"
description = "SIM001 launcher: set up controllers, render the docs, start the simulator or the whole station. Built on GPUI"

[dependencies]
gpui = "0.2.2"
# Lists the USB controllers that are plugged in.
hidapi = "2"
# The shared look (the console, the sim's HUD and the docs use it too).
illustration_theme = { path = "../../illustration/theme" }
# The debug log: the files the console and ArduPlane write, read here (the same code the console writes them with).
teleoperation_core = { path = "../core" }
# Acceptance tests (`--expect`): see github.com/ptescher/expectation and expectations/10-launcher.
expectation_harness = { git = "https://github.com/ptescher/expectation" }
expectation_model = { git = "https://github.com/ptescher/expectation" }
expectation_story = { git = "https://github.com/ptescher/expectation" }
suite_budget = { path = "../../../tools/suite_budget" }
# The screenshots' JPEGs (snapshot.rs); the same image crate as GPUI's.
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[[bin]]
name = "sim001_launcher"
path = "src/main.rs"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
