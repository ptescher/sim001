[package]
name = "teleoperation_console"
version = "0.1.0"
edition = "2024"
description = "Ground control station for SIM001 + ArduPlane SITL, built on GPUI"

[dependencies]
gpui = "0.2.2"
mavlink = { version = "0.19", default-features = false, features = ["std", "transport-tcp", "transport-udp", "dialect-ardupilotmega", "dialect-common", "mav2-message-extensions"] }
image = { version = "0.25", default-features = false, features = ["png"] }
teleoperation_shared = { path = "../shared" }
# The link, the vehicle and the map geometry, without a screen (the iOS app uses them too).
teleoperation_core = { path = "../core" }
# The map pack format: the console shows a real place's map.
visualization_mappack = { path = "../../visualization/mappack" }
# Which planes there are, and whether one is a VTOL (the console then shows the Q modes).
simulation_aircraft = { path = "../../simulation/aircraft" }
# The computer pilots, each of whose planes has an autopilot of its own (domains/recreation).
recreation_games = { path = "../../recreation/games" }
# Other aircraft: what the radio tells the station, joined into one picture (domains/communication).
communication_traffic = { path = "../../communication/traffic" }
communication_telemetry = { path = "../../communication/telemetry" }
# The shared look (the docs and the sim's HUD use it too).
illustration_theme = { path = "../../illustration/theme" }
raw-window-handle = "0.6"
# Acceptance tests (`--expect`): see domains/expectation and expectations/.
expectation_harness = { path = "../../expectation/harness" }
expectation_model = { path = "../../expectation/model" }
expectation_story = { path = "../../expectation/story" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", features = ["NSScreen", "NSWindow", "NSResponder", "NSGraphics", "NSView", "NSButton", "NSControl"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSGeometry"] }

# Keep `cargo run` (debug) usable: optimize dependencies.
[profile.dev.package."*"]
opt-level = 3

# GPUI with one change: `DispatchEventResult` (what `Window::dispatch_event` returns) is public,
# so `--expect` can deliver mouse events to the console the way the platform does.
# See vendor/gpui/src/window.rs.
[patch.crates-io]
gpui = { path = "../../../vendor/gpui" }

[[bin]]
name = "sim001_gcs"
path = "src/main.rs"
