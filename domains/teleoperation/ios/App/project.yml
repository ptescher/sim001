name: T1SGroundStation
options:
  bundleIdPrefix: com.sim001
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: NO
targets:
  T1SGroundStation:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sim001.groundstation
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Talks to the flight controller on your network.
        SWIFT_OBJC_BRIDGING_HEADER: include/t1s-bridge.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/build/rust/$(PLATFORM_NAME)
        OTHER_LDFLAGS: -lteleoperation_ios
    preBuildScripts:
      - name: Build the Rust station
        script: '"$SRCROOT/build_rust.sh"'
        basedOnDependencyAnalysis: false
  T1SUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: T1SGroundStation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sim001.groundstation.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  T1SGroundStation:
    build:
      targets:
        T1SGroundStation: all
    test:
      targets: [T1SUITests]
