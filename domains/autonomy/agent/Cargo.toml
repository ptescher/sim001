[package]
name = "autonomy_agent"
version = "0.1.0"
edition = "2024"
description = "Autonomy domain: the ground control agent. A brain decides a plan for each plane about once a second (ScriptedBrain: the computer pilots' strategy as plans), and a MAVLink link per plane sends it, with the game state, the AGENT mode switch and the other planes as ADSB_VEHICLE"

[dependencies]
autonomy_plan = { path = "../plan" }
glam = "0.33"
mavlink = { version = "0.19", default-features = false, features = ["std", "transport-tcp", "dialect-ardupilotmega", "dialect-common", "mav2-message-extensions"] }
