[package]
name = "autonomy_runner"
version = "0.1.0"
edition = "2024"
description = "Autonomy domain: plays a game of tag between planes flown by real ArduPlane SITL instances, headless and faster than real time (the F1 level of plans/sim2real-tag.md)"

[dependencies]
simulation_aircraft = { path = "../../simulation/aircraft" }
simulation_physics = { path = "../../simulation/physics" }
simulation_sitl = { path = "../../simulation/sitl" }
recreation_games = { path = "../../recreation/games" }
glam = "0.33"
# --agent: the ground control agent flies the planes with plans, over MAVLink.
autonomy_agent = { path = "../agent" }
autonomy_plan = { path = "../plan" }
