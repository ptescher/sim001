[package]
name = "cognition_agent"
version = "0.1.0"
edition = "2024"
description = "Cognition domain: the ground control agent. A brain decides a plan for each plane about once a second (ScriptedBrain: the computer pilots' strategy as plans), and a MAVLink link per plane sends it, with the game state, the AGENT mode switch and the other planes as ADSB_VEHICLE"

[dependencies]
cognition_plan = { path = "../plan" }
glam.workspace = true
mavlink = { workspace = true, features = ["transport-tcp", "transport-direct-serial", "dialect-ardupilotmega"] }
