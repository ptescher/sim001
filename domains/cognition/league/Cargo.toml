[package]
name = "cognition_league"
version = "0.1.0"
edition = "2024"
description = "Cognition domain: the league that keeps making the executor better. Strategies (an evolution strategy, Claude agents) give challengers; the fast arena plays them on the champion's seeds; a challenger that is clearly better and safe becomes the champion (plans/league.md)"

[dependencies]
cognition_arena = { path = "../arena" }
cognition_agent = { path = "../agent" }
cognition_executor = { path = "../executor" }
cognition_towers = { path = "../towers" }
recreation_towers = { path = "../../recreation/towers" }
fastrand.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# The acceptance tests (tests/acceptance.rs): the section "Making the executor better".
expectation_harness.workspace = true
expectation_model.workspace = true
expectation_story.workspace = true
