[package]
name = "cognition_runner"
version = "0.1.0"
edition = "2024"
description = "Cognition domain: plays a game of tag between planes flown by real ArduPlane SITL instances, headless and faster than real time (the F1 level of plans/sim2real-tag.md)"

[dependencies]
simulation_aircraft = { path = "../../simulation/aircraft" }
simulation_physics = { path = "../../simulation/physics" }
simulation_sitl = { path = "../../simulation/sitl" }
recreation_games = { path = "../../recreation/games" }
glam.workspace = true
# --agent: the ground control agent flies the planes with plans, over MAVLink.
cognition_agent = { path = "../agent" }
cognition_plan = { path = "../plan" }

[dev-dependencies]
# The acceptance tests (tests/acceptance.rs): the section "Flying by plan" in real ArduPlane SITL.
expectation_harness.workspace = true
expectation_model.workspace = true
expectation_story.workspace = true
suite_budget = { path = "../../../tools/suite_budget" }
