[package]
name = "visualization_viewer"
version = "0.1.0"
edition = "2024"
description = "Visualization domain: sim001_view, the 3D view of a real plane from its MAVLink telemetry, and pictures of the scenery"

[[bin]]
name = "sim001_view"
path = "src/main.rs"

[dependencies]
visualization_engine = { path = "../engine" }
# The ground station's battlefield (--battlefield).
visualization_battlefield = { path = "../battlefield" }
teleoperation_shared = { path = "../../teleoperation/shared" }
visualization_telemetry = { path = "../telemetry" }
bevy.workspace = true
