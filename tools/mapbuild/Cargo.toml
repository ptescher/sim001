[package]
name = "mapbuild"
version = "0.1.0"
edition = "2024"
description = "Builds real-world map packs for t1s_sim from USGS 3DEP lidar, USGS NAIP imagery and OpenStreetMap"

[dependencies]
t1s_station = { path = "../../station" }
ureq = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
tiff = "0.9"
serde_json = "1"

[profile.dev]
opt-level = 2
